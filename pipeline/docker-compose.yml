# Spark images: Bitnami stopped publishing/maintaining public Spark images; default to Apache's official images.
# Override with SPARK_IMAGE=... if you have a private mirror/registry.
# Example: SPARK_IMAGE=apache/spark:3.5.3 docker compose -f pipeline/docker-compose.yml up -d
x-spark-image: &spark_image ${SPARK_IMAGE:-apache/spark:3.5.3}

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: "root"
      MARIADB_DATABASE: "aiops"
      MARIADB_USER: "aiops"
      MARIADB_PASSWORD: "aiops"
    ports:
      - "13306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -proot --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - kafka
    environment:
      # Avoid log4j trying to write logs to "/" inside this init container.
      KAFKA_LOG4J_OPTS: "-Dkafka.logs.dir=/tmp"
    entrypoint:
      - bash
      - -lc
      - |
        set -euo pipefail
        echo "Waiting for Kafka broker to accept requests..."
        for i in $$(seq 1 60); do
          kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1 && break
          sleep 2
        done
        kafka-topics --bootstrap-server kafka:9092 --list >/dev/null
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic openstack.raw --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic openstack.features --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic openstack.alerts --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --list
        echo "Kafka topics ready."
    restart: "no"

  spark-master:
    image: *spark_image
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    environment:
      # Optional: enable HDFS client config when starting with --profile hadoop.
      - HADOOP_CONF_DIR=/opt/spark/conf/hadoop
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ../:/opt/workspace:ro
      - ./streaming:/opt/pipeline/streaming:ro
      - spark-checkpoints:/opt/checkpoints
      - ./hadoop/conf:/opt/spark/conf/hadoop:ro

  spark-worker:
    image: *spark_image
    depends_on:
      - spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "2"
      - --memory
      - 2g
      - --webui-port
      - "8081"
    environment:
      - HADOOP_CONF_DIR=/opt/spark/conf/hadoop
    ports:
      - "8081:8081"
    volumes:
      - ./hadoop/conf:/opt/spark/conf/hadoop:ro

  spark-streaming:
    image: *spark_image
    depends_on:
      - spark-master
      - spark-worker
      - kafka-init
    environment:
      - HADOOP_CONF_DIR=/opt/spark/conf/hadoop
    volumes:
      - ./streaming:/opt/pipeline/streaming:ro
      - ./hadoop/conf:/opt/spark/conf/hadoop:ro
      - spark-checkpoints:/opt/checkpoints
      - spark-ivy:/tmp/.ivy2
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        wait_port() {
          local host="$1"
          local port="$2"
          for i in $$(seq 1 60); do
            (echo >"/dev/tcp/$${host}/$${port}") >/dev/null 2>&1 && return 0
            sleep 2
          done
          return 1
        }

        echo "Waiting for Spark master (7077)..."
        wait_port spark-master 7077
        echo "Waiting for Kafka (9092)..."
        wait_port kafka 9092

        HDFS_ARGS=()
        if getent hosts namenode >/dev/null 2>&1; then
          if (echo >"/dev/tcp/namenode/8020") >/dev/null 2>&1; then
            HDFS_ARGS+=(
              --hdfs-records-path hdfs://namenode:8020/data/openstack/records
              --hdfs-features-path hdfs://namenode:8020/data/openstack/features
            )
            echo "HDFS detected; enabling Parquet sinks."
          fi
        fi

        exec /opt/spark/bin/spark-submit \
          --master spark://spark-master:7077 \
          --conf spark.jars.ivy=/tmp/.ivy2 \
          --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,org.apache.spark:spark-token-provider-kafka-0-10_2.12:3.5.3 \
          /opt/pipeline/streaming/openstack_streaming_job.py \
            --bootstrap kafka:9092 \
            --raw-topic openstack.raw \
            --features-topic openstack.features \
            --window 60 \
            --slide 30 \
            --checkpoint /opt/checkpoints/openstack_streaming_job \
            "$${HDFS_ARGS[@]}"
    restart: unless-stopped

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    profiles: ["hadoop"]
    environment:
      CLUSTER_NAME: "openstack-aiops"
      CORE_CONF_fs_defaultFS: "hdfs://namenode:8020"
      HDFS_CONF_dfs_replication: "1"
    ports:
      - "9870:9870" # NameNode Web UI
      - "8020:8020" # NameNode RPC
    volumes:
      - hadoop-namenode:/hadoop/dfs/name

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    profiles: ["hadoop"]
    depends_on:
      - namenode
    environment:
      CORE_CONF_fs_defaultFS: "hdfs://namenode:8020"
      HDFS_CONF_dfs_replication: "1"
    ports:
      - "9864:9864" # DataNode Web UI
    volumes:
      - hadoop-datanode:/hadoop/dfs/data

  hdfs-init:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    profiles: ["hadoop"]
    depends_on:
      - namenode
      - datanode
    entrypoint:
      - bash
      - -lc
      - |
        set -euo pipefail
        HDFS="$(command -v hdfs || true)"
        if [ -z "$$HDFS" ] && [ -x "/opt/hadoop-3.2.1/bin/hdfs" ]; then
          HDFS="/opt/hadoop-3.2.1/bin/hdfs"
        fi
        if [ -z "$$HDFS" ]; then
          echo "ERROR: hdfs CLI not found in container; cannot initialize HDFS directories."
          exit 1
        fi
        for i in $$(seq 1 60); do
          "$$HDFS" dfs -ls / >/dev/null 2>&1 && break
          sleep 2
        done
        "$$HDFS" dfs -ls / >/dev/null
        "$$HDFS" dfs -mkdir -p /data/openstack/records /data/openstack/features
        "$$HDFS" dfs -chmod -R 777 /data/openstack
        echo "HDFS directories ready."
    restart: "no"

  backend:
    image: python:3.10-slim
    depends_on:
      - kafka
      - mariadb
    ports:
      - "8000:8000"
    environment:
      APP_KAFKA_BOOTSTRAP: "kafka:9092"
      APP_KAFKA_FEATURES_TOPIC: "openstack.features"
      APP_KAFKA_RAW_TOPIC: "openstack.raw"
      APP_KAFKA_ALERTS_TOPIC: "openstack.alerts"
      # DB: default to MariaDB for the "big data" scheme; change to sqlite:////data/alerts.db if preferred.
      APP_DB_URL: "mysql+pymysql://aiops:aiops@mariadb:3306/aiops?charset=utf8mb4"
      APP_MODEL_DIR: "/models"
      APP_ALERT_THRESHOLD: "0.7"
      APP_REPLAY_LOG_DIR: "/opt/workspace"
      APP_REPLAY_RATE: "80"
      # LLM analysis is optional; default "mock" generates deterministic suggestions without external calls.
      APP_LLM_MODE: "mock"
    volumes:
      - "../:/opt/workspace:ro"
      - "../label&train/output/artifacts:/models:ro"
      - alerts-db:/data
      - ./service:/app:ro
    working_dir: /app
    command: >
      bash -lc "
      set -euo pipefail
      wait_port() {
        local host=\"$1\"
        local port=\"$2\"
        for i in \$$(seq 1 60); do
          (echo >\"/dev/tcp/\$${host}/\$${port}\") >/dev/null 2>&1 && return 0
          sleep 2
        done
        return 1
      }
      echo \"Waiting for Kafka (kafka:9092)...\"
      wait_port kafka 9092
      echo \"Waiting for MariaDB (mariadb:3306)...\"
      wait_port mariadb 3306
      pip install --no-cache-dir -r /app/requirements-service.txt &&
      python -m service.app
      "

volumes:
  mariadb-data:
  alerts-db:
  spark-checkpoints:
  spark-ivy:
  hadoop-namenode:
  hadoop-datanode:
